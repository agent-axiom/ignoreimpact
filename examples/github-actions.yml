# Copy into your project's .github/workflows/ignoreimpact.yml and set a reviewed
# IgnoreImpact commit. The fixture compares explicit root .dockerignore files.
name: Ignore policy impact
on: [pull_request]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install a reviewed IgnoreImpact revision
        env:
          # Replace with an immutable, reviewed commit before enabling this job.
          IGNOREIMPACT_REV: REPLACE_WITH_REVIEWED_COMMIT
        run: go install github.com/agent-axiom/ignoreimpact/cmd/ignoreimpact@"$IGNOREIMPACT_REV"
      - name: Compare base policy with the current tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/base.dockerignore"
          if git cat-file -e "$BASE_SHA:.dockerignore" 2>/dev/null; then
            git show "$BASE_SHA:.dockerignore" > "$base"
          else
            : > "$base"
          fi
          candidate="$RUNNER_TEMP/candidate.dockerignore"
          if test -f .dockerignore; then cp .dockerignore "$candidate"; else : > "$candidate"; fi
          ignoreimpact compare --before "$base" --after "$candidate" --fail-on added
# This only reads the checked-out tree. It does not run scripts from the PR.
# Set --context to your build context, and adapt policy paths for custom Dockerfiles.
