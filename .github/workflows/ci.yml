name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.x'
          - os: ubuntu-latest
            go: '1.27.x'
          - os: macos-latest
            go: '1.27.x'
          - os: windows-latest
            go: '1.27.x'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/ignoreimpact
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Differential fuzz smoke test
        if: runner.os == 'Linux' && matrix.go == '1.27.x'
        run: go test ./internal/policy -fuzz=FuzzMatchesOfficial -fuzztime=15s
      - name: Verify committed JSON example
        if: runner.os == 'Linux' && matrix.go == '1.27.x'
        shell: bash
        run: |
          ./ignoreimpact compare --context examples/demo/context --before examples/demo/before.dockerignore --after examples/demo/after.dockerignore --json > "$RUNNER_TEMP/demo.json"
          diff -u examples/demo/report.json "$RUNNER_TEMP/demo.json"
